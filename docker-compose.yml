# Despliegue completo con un solo comando:   docker compose up -d --build
# Orden de arranque: db (sano) -> etl (termina OK) -> simulador + grafana
# Credenciales: se leen del archivo .env (no versionado). Ver .env.example.
name: bi-vinilos-oee

services:
  db:
    image: postgres:16-alpine
    container_name: bi_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BI_LECTOR_PASSWORD: ${BI_LECTOR_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      SIM_DB_PASSWORD: ${SIM_DB_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data          # persistencia de datos
      - ./db/init:/docker-entrypoint-initdb.d:ro  # crea roles de solo lectura la 1.ª vez
    ports:
      - "${DB_PUERTO_HOST:-5432}:5432"           # para DBeaver y Power BI en el anfitrión
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: bi_etl
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FUENTE_EXCEL: /app/data/raw/SEGUIMIENTO_TEMPERAS_Y_VINILOS_Actividad.xlsm
    volumes:
      - ./data/raw:/app/data/raw:ro               # el Excel fuente (solo lectura)
      - ./docs/generados:/app/docs/generados      # reporte de calidad y conciliación
    depends_on:
      db:
        condition: service_healthy
    restart: "no"                                 # corre una vez y termina

  simulador:
    build: ./simulador
    container_name: bi_simulador
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      SIM_DB_USER: simulador
      SIM_DB_PASSWORD: ${SIM_DB_PASSWORD}
      TICK_SEGUNDOS: ${TICK_SEGUNDOS:-30}
      BACKFILL_HORAS: ${BACKFILL_HORAS:-40}
      TZ: America/Bogota
    depends_on:
      etl:
        condition: service_completed_successfully
    restart: unless-stopped

  alertas:
    build: ./simulador
    container_name: bi_alertas
    command: ["python", "receptor_alertas.py"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: bi_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/monitoreo_lineas.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Bogota
      # usadas por provisioning/datasources/postgres.yaml
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PUERTO_HOST:-3000}:3000"
    depends_on:
      etl:
        condition: service_completed_successfully
      alertas:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:
